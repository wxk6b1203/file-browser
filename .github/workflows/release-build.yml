name: Release Build

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: file-browser
  WAILS_VERSION: v2.11.0
  NODE_VERSION: '24.14.0'

jobs:
  build:
    name: Build ${{ matrix.suffix }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux/amd64
            suffix: linux-amd64
            os: linux
          - runner: ubuntu-22.04-arm
            platform: linux/arm64
            suffix: linux-arm64
            os: linux
          - runner: windows-2025
            platform: windows/amd64
            suffix: windows-amd64
            os: windows
          - runner: windows-11-arm
            platform: windows/arm64
            suffix: windows-arm64
            os: windows
          - runner: macos-15-intel
            platform: darwin/amd64
            suffix: darwin-amd64
            os: macos
          - runner: macos-15
            platform: darwin/arm64
            suffix: darwin-arm64
            os: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux Wails dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Wails app
        shell: bash
        run: |
          wails build \
            -clean \
            -platform "${{ matrix.platform }}" \
            -o "${{ env.APP_NAME }}-${{ matrix.suffix }}" \
            -trimpath

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          package_dir="dist/${{ env.APP_NAME }}-${{ github.ref_name }}-${{ matrix.suffix }}"
          archive="dist/${{ env.APP_NAME }}-${{ github.ref_name }}-${{ matrix.suffix }}.tar.gz"
          mkdir -p "$package_dir"
          find build/bin -mindepth 1 -maxdepth 1 ! -name '.DS_Store' -exec cp -R {} "$package_dir/" \;
          tar -czf "$archive" -C dist "$(basename "$package_dir")"
          ls -lh "$archive"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ github.ref_name }}-${{ matrix.suffix }}
          path: dist/${{ env.APP_NAME }}-${{ github.ref_name }}-${{ matrix.suffix }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GH_REPO" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/*.tar.gz --repo "$GH_REPO" --clobber
