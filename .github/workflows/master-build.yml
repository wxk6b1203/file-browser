name: Master Test

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: master-test-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.14.0'

jobs:
  test:
    name: Test And Type Check
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux frontend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run Go tests
        run: go test ./...

      - name: Run frontend unit tests
        run: npm run test:unit --prefix frontend

      - name: Run frontend type check
        run: npm run type-check --prefix frontend
