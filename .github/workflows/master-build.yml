name: Master Build

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: master-build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: file-browser
  WAILS_VERSION: v2.11.0
  NODE_VERSION: '24.14.0'

jobs:
  build:
    name: Build ${{ matrix.suffix }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux/amd64
            suffix: linux-amd64
            os: linux
            binary_ext: ''
          - runner: ubuntu-22.04-arm
            platform: linux/arm64
            suffix: linux-arm64
            os: linux
            binary_ext: ''
          - runner: windows-2025
            platform: windows/amd64
            suffix: windows-amd64
            os: windows
            binary_ext: '.exe'
          - runner: windows-11-arm
            platform: windows/arm64
            suffix: windows-arm64
            os: windows
            binary_ext: '.exe'
          - runner: macos-15-intel
            platform: darwin/amd64
            suffix: darwin-amd64
            os: macos
            binary_ext: ''
          - runner: macos-15
            platform: darwin/arm64
            suffix: darwin-arm64
            os: macos
            binary_ext: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux Wails dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Wails app
        shell: bash
        run: |
          wails build \
            -clean \
            -platform "${{ matrix.platform }}" \
            -o "${{ env.APP_NAME }}-${{ matrix.suffix }}${{ matrix.binary_ext }}" \
            -trimpath

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          build_ref="${GITHUB_SHA::7}"
          package_dir="dist/${{ env.APP_NAME }}-master-${build_ref}-${{ matrix.suffix }}"
          archive="dist/${{ env.APP_NAME }}-master-${build_ref}-${{ matrix.suffix }}.tar.gz"
          mkdir -p "$package_dir"
          find build/bin -mindepth 1 -maxdepth 1 ! -name '.DS_Store' -exec cp -R {} "$package_dir/" \;
          tar -czf "$archive" -C dist "$(basename "$package_dir")"
          ls -lh "$archive"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-master-${{ github.sha }}-${{ matrix.suffix }}
          path: dist/${{ env.APP_NAME }}-master-*-${{ matrix.suffix }}.tar.gz
          if-no-files-found: error
          retention-days: 14
